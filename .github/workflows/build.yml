name: Build Flutter apps (Android + Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [Coffee_Business_Agent, Mechatronics_Engineer_Agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Accept Android licenses and install platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - name: Build Android APK
        working-directory: ${{ matrix.app }}
        run: |
          PKG=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          flutter create --platforms=android --project-name "$PKG" --org com.myagents .
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.INTERNET' $M || sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          # مكتبات AndroidX الحديثة تطلب compileSdk 36 على الأقل
          G=android/app/build.gradle.kts; [ -f "$G" ] || G=android/app/build.gradle
          sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdk = 36/' "$G"
          grep -n 'compileSdk' "$G"
          grep -Eq 'compileSdk *= *(3[6-9]|[4-9][0-9])' "$G" || echo "WARNING: compileSdk may be below 36 — check the line above"
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [Coffee_Business_Agent, Mechatronics_Engineer_Agent]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build Windows application
        working-directory: ${{ matrix.app }}
        shell: cmd
        run: |
          for /f "tokens=2" %%a in ('findstr /b "name:" pubspec.yaml') do set PKG=%%a
          call flutter create --platforms=windows --project-name %PKG% --org com.myagents .
          if exist test\widget_test.dart del test\widget_test.dart
          call flutter pub get
          call flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: ${{ matrix.app }}/build/windows/x64/runner/Release
