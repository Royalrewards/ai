name: Build Flutter apps (Android + Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.f.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        run: |
          apps=$(find . -name pubspec.yaml -not -path '*/.*' -not -path '*/build/*' -exec dirname {} \; | sed 's|^\./||' | sort | jq -R '{path: ., name: gsub("/"; "_")}' | jq -sc .)
          echo "Found Flutter apps: $apps"
          [ "$apps" != "[]" ] || { echo "ERROR: no pubspec.yaml found in repo. Folders were not uploaded."; find . -not -path './.git/*' | head -50; exit 1; }
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
  android:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Accept Android licenses and install platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - name: Build Android APK
        working-directory: ${{ matrix.app.path }}
        run: |
          PKG=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          flutter create --platforms=android --project-name "$PKG" --org com.myagents .
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.INTERNET' $M || sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          # مكتبات AndroidX الحديثة تطلب compileSdk 36 على الأقل
          G=android/app/build.gradle.kts; [ -f "$G" ] || G=android/app/build.gradle
          sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdk = 36/' "$G"
          grep -n 'compileSdk' "$G"
          grep -Eq 'compileSdk *= *(3[6-9]|[4-9][0-9])' "$G" || echo "WARNING: compileSdk may be below 36 — check the line above"
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-apk
          path: ${{ matrix.app.path }}/build/app/outputs/flutter-apk/app-release.apk
  windows:
    needs: discover
    runs-on: windows-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Build Windows application
        working-directory: ${{ matrix.app.path }}
        shell: cmd
        run: |
          for /f "tokens=2" %%a in ('findstr /b "name:" pubspec.yaml') do set PKG=%%a
          call flutter create --platforms=windows --project-name %PKG% --org com.myagents .
          if exist test\widget_test.dart del test\widget_test.dart
          call flutter pub get
          call flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-windows
          path: ${{ matrix.app.path }}/build/windows/x64/runner/Release
