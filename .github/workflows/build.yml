name: Build Flutter apps (Android + Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Keep separate workflow runs from cancelling each other.
concurrency:
  group: flutter-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.app }} - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    # Build all four outputs independently. One failure will not cancel the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Coffee_Business_Agent
            platform: android
            os: ubuntu-latest
          - app: Coffee_Business_Agent
            platform: windows
            os: windows-latest
          - app: Mechatronics_Engineer_Agent
            platform: android
            os: ubuntu-latest
          - app: Mechatronics_Engineer_Agent
            platform: windows
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Flutter's Android toolchain needs a JDK. Java 17 is retained for
      # compatibility with the Android Gradle setup generated by Flutter.
      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Check project files
        shell: bash
        working-directory: fixed/${{ matrix.app }}
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::error::pubspec.yaml was not found in $PWD"
            exit 1
          fi

          PACKAGE_NAME="$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not read the package name from pubspec.yaml"
            exit 1
          fi
          echo "Package name: $PACKAGE_NAME"

      - name: Prepare Android platform
        if: matrix.platform == 'android'
        shell: bash
        working-directory: fixed/${{ matrix.app }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"

          flutter create \
            --platforms=android \
            --project-name "$PACKAGE_NAME" \
            --org com.myagents \
            .

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml was not generated"
            exit 1
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

          if [ -f test/widget_test.dart ]; then
            rm test/widget_test.dart
          fi

      - name: Prepare Windows platform
        if: matrix.platform == 'windows'
        shell: bash
        working-directory: fixed/${{ matrix.app }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"

          flutter create \
            --platforms=windows \
            --project-name "$PACKAGE_NAME" \
            --org com.myagents \
            .

          if [ -f test/widget_test.dart ]; then
            rm test/widget_test.dart
          fi

      - name: Get Flutter dependencies
        shell: bash
        working-directory: fixed/${{ matrix.app }}
        run: flutter pub get

      - name: Build Android APK
        if: matrix.platform == 'android'
        shell: bash
        working-directory: fixed/${{ matrix.app }}
        run: flutter build apk --release

      - name: Build Windows application
        if: matrix.platform == 'windows'
        shell: bash
        working-directory: fixed/${{ matrix.app }}
        run: flutter build windows --release

      # Including run_id and run_attempt prevents HTTP 409 artifact-name
      # conflicts when a workflow/job is re-run.
      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixed/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows build
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixed/${{ matrix.app }}/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
